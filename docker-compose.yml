version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/storage:/workspace/app/storage
    environment:
      - ALLOWED_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - MAX_FILE_SIZE_MB=50
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    restart: always
